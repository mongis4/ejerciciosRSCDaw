<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="compra.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <main>
      <form id="id-form" action="">
        <div>
          <label>Producto: <input type="text" id="id-producto" /></label>
          <label>Precio: <input type="number" id="id-precio" /></label>
        </div>
        <div>
          <label>
            Categoria:
            <select id="id-categoria">
              <!-- Pendiente rellenar dinamico -->
            </select>
          </label>
          <button id="btn-anadir" type="button">Añadir</button>
        </div>
      </form>
      <section>
        <div>
          <label>
            Ver:
            <select id="id-select-categoria">
              <option value="Todas">Todas</option>
              <option value="Alimentacion">Alimentacion</option>
              <option value="Limpieza">Limpieza</option>
              <option value="Bebidas">Bebidas</option>
            </select>
          </label>
        </div>
        <div><button id="btn-vaciar" type="button">Vaciar</button></div>
        <ul id="id-lista"></ul>
        <p id="id-total"></p>
        <p id="id-avisos"></p>
      </section>
    </main>
  </body>
</html>
